<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Voice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef1f6;
    --surface: #ffffff;
    --ink: #1b2540;
    --muted: #5d6783;
    --line: #cfd6e4;
    --accent: #4b3fd6;
    --accent-ink: #ffffff;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121830;
      --surface: #1b2340;
      --ink: #e8ecf7;
      --muted: #9aa4c2;
      --line: #313b60;
      --accent: #8f86ff;
      --accent-ink: #121830;
      --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Bricolage Grotesque", "Noto Sans Devanagari", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 640px; align-self: center; }
  h1 { font-size: clamp(2rem, 7vw, 3rem); line-height: 1.05; margin: 0 0 8px; letter-spacing: -0.02em; }
  p.lead { margin: 0 0 28px; color: var(--muted); font-size: 1.05rem; max-width: 46ch; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  textarea {
    width: 100%; min-height: 150px; resize: vertical; border: 0; outline: 0;
    background: transparent; color: var(--ink); font: inherit; font-size: 1.1rem; line-height: 1.5;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; }
  .count { color: var(--muted); font-size: 0.9rem; }
  button {
    font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 12px 26px;
    background: var(--accent); color: var(--accent-ink); cursor: pointer;
  }
  button:disabled { opacity: 0.55; cursor: progress; }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wave { display: flex; align-items: center; justify-content: center; gap: 5px; height: 72px; margin-top: 24px; }
  .wave span { width: 5px; height: 8px; border-radius: 3px; background: var(--accent); opacity: 0.35; transition: height 0.12s ease; }
  .wave.live span { opacity: 1; animation: pulse 0.9s ease-in-out infinite; }
  .wave.live span:nth-child(3n)   { animation-delay: -0.2s; }
  .wave.live span:nth-child(3n+1) { animation-delay: -0.45s; }
  .wave.live span:nth-child(5n)   { animation-delay: -0.65s; }
  @keyframes pulse { 0%, 100% { height: 10px; } 50% { height: 60px; } }
  @media (prefers-reduced-motion: reduce) {
    .wave.live span { animation: none; height: 36px; }
  }
  .status { min-height: 1.4em; margin: 12px 0 0; color: var(--muted); font-size: 0.95rem; text-align: center; }
  .status.error { color: var(--error); }
</style>
</head>
<body>
<main>
  <h1>Type it. Hear it in my voice.</h1>
  <p class="lead">Write anything below and your cloned voice will read it aloud.</p>

  <div class="card">
    <label for="text" class="count" style="display:block;margin-bottom:6px">Your text</label>
    <textarea id="text" maxlength="1000" placeholder="Namaskar, mi maza aavaj vaparun bolat ahe."></textarea>
    <div class="row">
      <span class="count" id="count">0 / 1000</span>
      <button id="speak" type="button">Speak</button>
    </div>
  </div>

  <div class="wave" id="wave" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <audio id="player" hidden></audio>
</main>

<script>
  const text = document.getElementById('text');
  const count = document.getElementById('count');
  const btn = document.getElementById('speak');
  const wave = document.getElementById('wave');
  const statusEl = document.getElementById('status');
  const player = document.getElementById('player');
  let currentUrl = null;

  text.addEventListener('input', () => { count.textContent = text.value.length + ' / 1000'; });

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('error', !!isError);
  }

  player.addEventListener('ended', () => { wave.classList.remove('live'); setStatus(''); });
  player.addEventListener('pause', () => wave.classList.remove('live'));

  btn.addEventListener('click', async () => {
    const value = text.value.trim();
    if (!value) { setStatus('Type some text first.', true); return; }

    btn.disabled = true;
    wave.classList.remove('live');
    setStatus('Generating your voice…');

    try {
      const res = await fetch('/api/speak', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: value })
      });
      if (!res.ok) {
        let msg = 'Could not generate audio.';
        try { msg = (await res.json()).error || msg; } catch (e) {}
        throw new Error(msg);
      }
      const blob = await res.blob();
      if (currentUrl) URL.revokeObjectURL(currentUrl);
      currentUrl = URL.createObjectURL(blob);
      player.src = currentUrl;
      await player.play();
      wave.classList.add('live');
      setStatus('Speaking…');
    } catch (err) {
      setStatus(err.message, true);
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
